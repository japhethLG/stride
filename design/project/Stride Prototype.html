<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stride — Prototype</title>
<link rel="stylesheet" href="stride-tokens.css" />
<style>
  html, body { margin: 0; background: #060709; }
  @keyframes strideSpin { to { transform: rotate(360deg); } }
  @keyframes stridePulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  @keyframes stridePing { 0% { transform: scale(.7); opacity: .5; } 80%,100% { transform: scale(2.1); opacity: 0; } }
  @keyframes strideToast { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .strideCard:active { transform: scale(.985); }
  .strideCard { -webkit-tap-highlight-color: transparent; }
  button { -webkit-tap-highlight-color: transparent; font-family: var(--font-body); }
  input { font-family: var(--font-body); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>

<script type="text/babel" src="screens-home.jsx"></script>
<script type="text/babel" src="screens-routes.jsx"></script>
<script type="text/babel" src="screens-record.jsx"></script>

</html>
